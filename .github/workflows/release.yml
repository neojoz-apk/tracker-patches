name: Build and release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: read

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v2

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew apiDump build

      - name: Check output
        run: |
          ls -la patches/build/libs
          ls patches/build/libs/patches-*.rvp

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" patches/build/libs/patches-*.rvp \
            --title "$TAG" \
            --notes "Automated build $TAG (commit ${GITHUB_SHA::7})" \
            --target "$GITHUB_SHA"
